---
- hosts: logging_elastic
  become: yes
  tasks:
    - name: Clean up temporary files
      file:
        path: /tmp/elastic.deb
        state: absent

    - name: Add Elastic 7.x Repository from Yandex Mirror
      apt_repository:
        repo: "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/7/ stable main"
        state: present
        filename: elastic-7.x

    - name: Install Elasticsearch via apt from Yandex mirror
      apt:
        name: elasticsearch
        state: present
        update_cache: yes

    - name: Configure Elasticsearch network bind
      lineinfile:
        path: /etc/elasticsearch/elasticsearch.yml
        regexp: '^#network.host:'
        line: 'network.host: 0.0.0.0'

    - name: Configure discovery type
      lineinfile:
        path: /etc/elasticsearch/elasticsearch.yml
        regexp: '^#discovery.type:'
        line: 'discovery.type: single-node'

    - name: Start and enable Elasticsearch service
      systemd:
        name: elasticsearch
        state: restarted
        enabled: yes
